apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  description: Install project dependencies using npm.
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        npm install
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run Jasmine unit tests.
  workspaces:
    - name: source
  steps:
    - name: jasmine-tests
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        npm install
        npx jasmine
